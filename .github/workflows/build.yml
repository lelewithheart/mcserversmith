name: build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Required so electron-builder may create the release and attach the installers.
# Without this the build succeeds and then fails with
# "HttpError: 403 Forbidden ... Resource not accessible by integration".
permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci || npm install
      - name: i18n coverage
        run: node tools/check-i18n.js
      - name: Config sanity
        run: node tools/check-yaml.js
      - name: Provider APIs (live)
        run: node tools/test-providers.js

  build:
    needs: verify
    strategy:
      fail-fast: false
      # one OS at a time: both jobs publish into the same release, and creating
      # it twice at the same moment races (422 already_exists)
      max-parallel: 1
      matrix:
        include:
          - os: windows-latest
            script: npm run dist:win -- --publish never
          - os: ubuntu-latest
            script: npm run dist:linux -- --publish never
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci || npm install
      - name: Generate icon
        run: node tools/make-icon.js
      - name: Build installers
        # Build artifacts only. Publishing is handled separately so CI does not
        # fail when release creation is unavailable to this token.
        run: ${{ matrix.script }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional code signing (Windows SmartScreen, macOS notarisation):
          # CSC_LINK: ${{ secrets.CSC_LINK }}
          # CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      - name: Checksums
        shell: bash
        run: |
          cd dist
          for f in *.exe *.AppImage *.deb *.tar.gz; do
            [ -f "$f" ] && sha256sum "$f" > "$f.sha256" || true
          done
          ls -la
      - name: Attach checksums to the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # electron-builder already created the release (as a draft) and uploaded
          # the binaries; the .sha256 files are generated after it, so they are
          # uploaded here — they are the only integrity proof while unsigned.
          gh release upload "${GITHUB_REF_NAME}" dist/*.sha256 --clobber || \
            echo "no release for ${GITHUB_REF_NAME} yet — skipping checksum upload"
      - uses: actions/upload-artifact@v4
        with:
          name: MCServerSmith-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.sha256
          if-no-files-found: warn
          retention-days: 14
