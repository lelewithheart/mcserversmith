name: build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Required by the release job: create the draft release for the pushed tag and
# upload the installers into it.
permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci || npm install
      - name: Tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          # electron-builder derives the release tag from package.json, not from the
          # git ref. A stale version therefore publishes into the *previous* release
          # (a v0.2.1 build once dropped its files into the v0.2.0 draft). Fail early.
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::package.json says $version but the pushed tag is $GITHUB_REF_NAME"
            exit 1
          fi
          echo "tag and package.json agree: $GITHUB_REF_NAME"
      - name: i18n coverage
        run: node tools/check-i18n.js
      - name: Config sanity
        run: node tools/check-yaml.js
      - name: Provider APIs (live)
        run: node tools/test-providers.js

  build:
    needs: verify
    strategy:
      fail-fast: false
      # Serial keeps the runs short on the free runner budget and the logs readable.
      # Publishing happens in the single `release` job below, so the matrix never
      # touches a release — it only uploads per-platform workflow artifacts.
      max-parallel: 1
      matrix:
        include:
          - os: windows-latest
            script: npm run dist:win -- --publish never
          - os: ubuntu-latest
            script: npm run dist:linux -- --publish never
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci || npm install
      - name: Generate icon
        run: node tools/make-icon.js
      - name: Build installers
        # Artifacts only. electron-builder must never publish here: two jobs
        # publishing into one tag race with a 422 and each create their own draft.
        run: ${{ matrix.script }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional code signing (Windows SmartScreen, macOS notarisation):
          # CSC_LINK: ${{ secrets.CSC_LINK }}
          # CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      - name: Checksums
        shell: bash
        run: |
          cd dist
          for f in *.exe *.AppImage *.deb; do
            [ -f "$f" ] && sha256sum "$f" > "$f.sha256" || true
          done
          ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: MCServerSmith-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.yml
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    needs: build
    # Draft releases only make sense for a tag; a manual dispatch just builds.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Every platform is present
        shell: bash
        run: |
          ls -la dist
          missing=0
          for pattern in '*.exe' '*.AppImage' '*.deb'; do
            if ! compgen -G "dist/$pattern" > /dev/null; then
              echo "::error::the release would ship without $pattern — refusing to publish"
              missing=1
            fi
          done
          exit $missing
      - name: Create or update the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Exactly one release per tag, created here and nowhere else, and both
          # platforms go into it — so nobody has to hunt for the Linux files in a
          # second, duplicate draft.
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --draft --title "MCServerSmith ${GITHUB_REF_NAME#v}" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
      - name: Release contents
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"
