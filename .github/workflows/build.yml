name: build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Required by the release job: create the draft release for the pushed tag and
# upload the installers into it.
permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci || npm install
      - name: Tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          # electron-builder derives the release tag from package.json, not from the
          # git ref. A stale version therefore publishes into the *previous* release
          # (a v0.2.1 build once dropped its files into the v0.2.0 draft). Fail early.
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::package.json says $version but the pushed tag is $GITHUB_REF_NAME"
            exit 1
          fi
          echo "tag and package.json agree: $GITHUB_REF_NAME"
      - name: i18n coverage
        run: node tools/check-i18n.js
      - name: Config sanity
        run: node tools/check-yaml.js
      - name: Provider APIs (live)
        run: node tools/test-providers.js

  build:
    needs: verify
    strategy:
      fail-fast: false
      # Serial keeps the runs short on the free runner budget and the logs readable.
      # Publishing happens in the single `release` job below, so the matrix never
      # touches a release — it only uploads per-platform workflow artifacts.
      max-parallel: 1
      matrix:
        include:
          # No extra --publish flag here! `npm run dist:win` already ends in exactly
          # one `--publish never`, and `npm run dist:win -- --publish never` would hand
          # electron-builder the array ["never","never"]. Its CLI accepts that without
          # complaint, compares it against the string "never", concludes publishing is
          # enabled and creates a second, Windows-only release. That is how releases
          # ended up split across duplicate drafts.
          - os: windows-latest
            script: npm run dist:win
          - os: ubuntu-latest
            script: npm run dist:linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci || npm install
      - name: Generate icon
        run: node tools/make-icon.js
      - name: Build installers
        # Artifacts only. Deliberately no GH_TOKEN in this job: a token plus an
        # enabled publish policy is all electron-builder needs to create its own
        # release, and the only thing allowed to create one is the `release` job.
        run: ${{ matrix.script }}
      - name: Checksums
        shell: bash
        run: |
          cd dist
          for f in *.exe *.AppImage *.deb; do
            [ -f "$f" ] && sha256sum "$f" > "$f.sha256" || true
          done
          ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: MCServerSmith-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/latest*.yml
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    needs: build
    # Draft releases only make sense for a tag; a manual dispatch just builds.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Every platform is present
        shell: bash
        run: |
          ls -la dist
          missing=0
          for pattern in '*.exe' '*.AppImage' '*.deb'; do
            if ! compgen -G "dist/$pattern" > /dev/null; then
              echo "::error::the release would ship without $pattern — refusing to publish"
              missing=1
            fi
          done
          exit $missing
      - name: Create or update the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The only place that touches a release: exactly one release per tag, one
          # upload with both platforms in it, so nobody has to hunt for the Linux
          # files in a second draft.
          count=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq "[.[] | select(.tagName == \"$GITHUB_REF_NAME\")] | length")
          if [ "$count" -eq 0 ]; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --draft --title "MCServerSmith ${GITHUB_REF_NAME#v}" --generate-notes
          elif [ "$count" -gt 1 ]; then
            # Duplicates of the same tag can only come from an old run that published
            # implicitly. Stop instead of guessing which one to upload into.
            echo "::error::$count releases exist for $GITHUB_REF_NAME — delete the duplicates first"
            gh release list --repo "$GITHUB_REPOSITORY" --json tagName,name,isDraft --jq '.[]'
            exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
      - name: Release contents
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"
